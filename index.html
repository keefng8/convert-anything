<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convert Anything</title>
<style>
  :root { color-scheme:dark; --glow:#4FD8FF; --text:#e8e6f5; --dim:#9b96bd; --bad:#ff7a6b; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; padding:18px 20px;
    background:#0a0813; color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
  header { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; margin-bottom:12px; }
  h1 { margin:0; font-size:19px; }
  .hint { color:var(--dim); font-size:13px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  select,button { padding:8px 13px; background:transparent; color:var(--glow); border:0;
    box-shadow:inset 0 0 0 1px rgba(79,216,255,.4); font-size:13.5px; cursor:pointer;
    font-family:inherit; }
  select { background:#07060f; color:var(--text); box-shadow:none;
    border:1px solid rgba(255,255,255,.12); }
  button.primary { background:var(--glow); color:#07222b; box-shadow:none; font-weight:600; }
  .arrow { color:var(--dim); }
  .panes { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:12px; min-height:0; }
  @media (max-width:820px){ .panes{grid-template-columns:1fr; grid-template-rows:1fr 1fr;} }
  textarea,pre { margin:0; height:100%; padding:14px; background:#07060f; color:#bfe9f7;
    border:1px solid rgba(255,255,255,.1); font-family:Consolas,monospace; font-size:13px;
    line-height:1.55; overflow:auto; resize:none; white-space:pre; }
  textarea:focus { outline:2px solid var(--glow); outline-offset:-2px; }
  .status { margin-top:10px; font-size:13px; min-height:20px; }
  .status.err { color:var(--bad); }
  .status.ok { color:var(--glow); }
</style>
</head>
<body>
  <header>
    <h1>Convert Anything</h1>
    <span class="hint">JSON, CSV, YAML and Markdown tables. All offline.</span>
  </header>

  <div class="bar">
    <select id="from">
      <option value="json">JSON</option>
      <option value="csv">CSV</option>
      <option value="yaml">YAML</option>
    </select>
    <span class="arrow">to</span>
    <select id="to">
      <option value="csv">CSV</option>
      <option value="json">JSON</option>
      <option value="yaml">YAML</option>
      <option value="markdown">Markdown table</option>
    </select>
    <button class="primary" id="go">Convert</button>
    <button id="copy">Copy</button>
    <button id="sample">Load a sample</button>
  </div>

  <div class="panes">
    <textarea id="in" spellcheck="false" placeholder="Paste here…"></textarea>
    <pre id="out"></pre>
  </div>
  <div class="status" id="status"></div>

<script>
const $ = id => document.getElementById(id);
const say = (t, c) => { $("status").textContent = t; $("status").className = "status " + (c || ""); };

// ---- CSV ------------------------------------------------------------------
// A state machine, not split(","). Quoted fields containing commas and
// newlines are normal in exported data, and splitting naively shifts every
// column after the first one.
function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] || "").trim() !== "");
}

function csvCell(v) {
  const s = v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function toCSV(rows) {
  if (!rows.length) return "";
  const headers = [...new Set(rows.flatMap(Object.keys))];
  return [headers.join(","), ...rows.map(r => headers.map(h => csvCell(r[h])).join(","))].join("\n");
}

// ---- YAML (the subset that round-trips with JSON) --------------------------
// Deliberately small. A full YAML parser is a large thing to get right, and
// silently mis-parsing an anchor or a multi-line block is worse than saying
// "this file uses YAML features I do not handle".
function toYAML(value, indent = 0) {
  const pad = "  ".repeat(indent);
  if (Array.isArray(value)) {
    if (!value.length) return pad + "[]";
    return value.map(v =>
      (v !== null && typeof v === "object")
        ? pad + "-\n" + toYAML(v, indent + 1)
        : pad + "- " + scalar(v)).join("\n");
  }
  if (value !== null && typeof value === "object") {
    const keys = Object.keys(value);
    if (!keys.length) return pad + "{}";
    return keys.map(k => {
      const v = value[k];
      return (v !== null && typeof v === "object")
        ? pad + k + ":\n" + toYAML(v, indent + 1)
        : pad + k + ": " + scalar(v);
    }).join("\n");
  }
  return pad + scalar(value);
}
function scalar(v) {
  if (v === null) return "null";
  if (typeof v !== "string") return String(v);
  return /^[\w .@/+-]*$/.test(v) && v.trim() === v && v !== "" ? v : JSON.stringify(v);
}

function parseYAML(text) {
  const unsupported = text.match(/^\s*(?:[&*]\w|[|>][-+]?\s*$|---\s*$|%YAML)/m);
  if (unsupported) {
    throw new Error("This uses YAML features this tool does not handle (anchors, " +
      "block scalars or multiple documents). Convert it with a full YAML parser.");
  }
  const lines = text.split("\n").filter(l => l.trim() && !/^\s*#/.test(l));
  const root = {};
  const stack = [{ indent: -1, node: root }];
  for (const line of lines) {
    const indent = line.match(/^ */)[0].length;
    const body = line.trim();
    while (stack.length > 1 && indent <= stack[stack.length - 1].indent) stack.pop();
    const parent = stack[stack.length - 1].node;

    if (body.startsWith("- ")) {
      const v = body.slice(2).trim();
      const arr = Array.isArray(parent) ? parent : null;
      if (!arr) throw new Error("List item outside a list at: " + body);
      arr.push(coerce(v));
      continue;
    }
    const m = body.match(/^([^:]+):\s*(.*)$/);
    if (!m) throw new Error("Cannot read line: " + body);
    const key = m[1].trim(), rest = m[2].trim();
    if (rest === "") {
      const child = {};
      parent[key] = child;
      stack.push({ indent, node: child });
    } else {
      parent[key] = coerce(rest);
    }
  }
  return root;
}
function coerce(v) {
  if (v === "null" || v === "~") return null;
  if (v === "true") return true;
  if (v === "false") return false;
  if (/^-?\d+(\.\d+)?$/.test(v)) return parseFloat(v);
  if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'")))
    return v.slice(1, -1);
  return v;
}

// ---- Markdown --------------------------------------------------------------
function toMarkdown(rows) {
  if (!rows.length) return "";
  const headers = [...new Set(rows.flatMap(Object.keys))];
  const cell = v => String(v == null ? "" : typeof v === "object" ? JSON.stringify(v) : v)
    .replace(/\|/g, "\\|").replace(/\n/g, " ");
  const widths = headers.map((h, i) =>
    Math.max(h.length, ...rows.map(r => cell(r[h]).length)));
  const line = cells => "| " + cells.map((c, i) => c.padEnd(widths[i])).join(" | ") + " |";
  return [
    line(headers),
    "|" + widths.map(w => "-".repeat(w + 2)).join("|") + "|",
    ...rows.map(r => line(headers.map(h => cell(r[h])))),
  ].join("\n");
}

// ---- wiring ---------------------------------------------------------------
function asRows(value) {
  // Tabular outputs need an array of flat objects. Say so rather than
  // producing a table with [object Object] in every cell.
  if (Array.isArray(value) && value.every(v => v && typeof v === "object" && !Array.isArray(v)))
    return value;
  if (value && typeof value === "object" && !Array.isArray(value)) return [value];
  throw new Error("CSV and Markdown need an array of objects. This is " +
    (Array.isArray(value) ? "an array of values" : typeof value) + ".");
}

function convert() {
  const text = $("in").value.trim();
  if (!text) { $("out").textContent = ""; say(""); return; }
  const from = $("from").value, to = $("to").value;

  try {
    let value;
    if (from === "json") value = JSON.parse(text);
    else if (from === "yaml") value = parseYAML(text);
    else {
      const rows = parseCSV(text);
      const headers = rows[0].map((h, i) => h.trim() || "column" + (i + 1));
      value = rows.slice(1).map(r =>
        Object.fromEntries(headers.map((h, i) => [h, coerce((r[i] ?? "").trim())])));
    }

    let out;
    if (to === "json") out = JSON.stringify(value, null, 2);
    else if (to === "yaml") out = toYAML(value);
    else if (to === "csv") out = toCSV(asRows(value));
    else out = toMarkdown(asRows(value));

    $("out").textContent = out;
    say(`${from.toUpperCase()} → ${to === "markdown" ? "Markdown" : to.toUpperCase()} · ${new Blob([out]).size.toLocaleString()} bytes`, "ok");
  } catch (e) {
    $("out").textContent = "";
    say(e.message, "err");
  }
}

$("go").onclick = convert;
$("in").addEventListener("input", () => { if ($("in").value.trim()) convert(); });
$("from").onchange = convert;
$("to").onchange = convert;
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("out").textContent);
    $("copy").textContent = "Copied"; setTimeout(() => ($("copy").textContent = "Copy"), 1300);
  } catch (e) { say("Select the text and copy", "err"); }
};
$("sample").onclick = () => {
  $("from").value = "json"; $("to").value = "markdown";
  $("in").value = JSON.stringify([
    { name: "Homelab Pulse", category: "Automation", price: 0, installs: 412 },
    { name: "Colour Lab", category: "Graphics", price: 0, installs: 188 },
    { name: "CSV Lens", category: "Data Science", price: 0, installs: 97 },
  ], null, 2);
  convert();
};
</script>
</body>
</html>
